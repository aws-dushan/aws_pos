<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One POS Menu</title>
<link rel="manifest" href="tv.webmanifest">
<link rel="icon" href="tv-icon.svg">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #root { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  #msg { position: absolute; left: 0; right: 0; top: 50%; margin-top: -12vh; color: #fff; text-align: center; font-family: Arial, Helvetica, sans-serif; }
  #msg .t { font-size: 3.4vh; opacity: .75; }
  #msg .h { font-size: 4.6vh; font-weight: bold; margin-top: 3vh; }
  #msg .code { font-size: 16vh; font-weight: bold; letter-spacing: 2vh; margin: 2vh 0; }
  #msg .s { font-size: 3vh; line-height: 1.6; opacity: .85; }
  #msg .err { font-size: 2.6vh; color: #999; }
</style>
</head>
<body>
<div id="root"><div id="stage"></div><div id="msg"></div></div>
<script>
/*
 * One POS TV player. Plain old JavaScript and simple CSS on purpose, so it runs in any smart TV's own web browser, old ones too
 * (no modern script features, no CSS grid, container units or colour mixing). The first time it gets a key and shows a 6-digit
 * code; a manager types the code on TV screens (Add TV) and the TV is linked to that branch. Then it asks the server every 10
 * seconds what to show and plays the design (drawn at 1920 x 1080 and scaled to the screen) with the branch's menu.
 * It is also the designer's preview: opened as tv.html?preview=1 in a frame, it plays what the designer sends it (postMessage)
 * with the signed-in manager's session, so the preview and the TVs are drawn by the same code.
 */
(function () {
  'use strict';
  var BASE = location.pathname.replace(/\/tv(\.html)?\/?$/, '');
  var KEY = BASE + 'signage.tv';
  var stage = document.getElementById('stage'), msg = document.getElementById('msg');
  var token = null, play = null, designKey = null, theme = null, slides = [], data = null;
  var idx = -1, slideTimer = null, pollTimer = null, current = null, round = 0, runTimers = [];
  var PREVIEW = /[?&]preview=1/.test(location.search), lockId = null;
  var version = null, reloadDue = false, reloading = false, newSeen = false;

  // ---------- small helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function req(method, path, body, done) {
    var x = new XMLHttpRequest();
    x.open(method, BASE + path, true);
    if (token) x.setRequestHeader('X-Signage-Token', token);
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      done(x.status, j);
    };
    x.send(body ? JSON.stringify(body) : null);
  }
  function price(n) { n = Number(n) || 0; return Math.round(n) === n ? String(n) : n.toFixed(2); }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hex(c) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c || '');
    if (!m) return [0, 0, 0];
    var h = m[1]; if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  function rgba(c, a) { var v = hex(c); return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')'; }
  function px(cqw) { return Math.round(cqw * 19.2 * 10) / 10 + 'px'; }   // the designer works in 1/100 of the width

  // The branch's time: weekday 0 = Sunday, minutes and seconds since midnight (the server says how far ahead of UTC it is).
  function clock() {
    var off = data && typeof data.utcOffset === 'number' ? data.utcOffset : 240;
    var d = new Date(new Date().getTime() + off * 60000);
    return { day: d.getUTCDay(), minutes: d.getUTCHours() * 60 + d.getUTCMinutes(), seconds: d.getUTCSeconds(), h: d.getUTCHours(), m: d.getUTCMinutes() };
  }
  function mins(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
  function secondsLeft(endsAt, c) { var e = mins(endsAt); return e === null ? null : e * 60 - (c.minutes * 60 + c.seconds); }
  function playsNow(s, c) {
    if (s.enabled === false) return false;
    if (s.layout === 'offer') { var left = secondsLeft(s.endsAt, c); if (left !== null && left <= 0) return false; }
    if (!s.schedule) return true;
    var days = s.schedule.days || [];
    if (days.length && days.indexOf(c.day) < 0) return false;
    var from = mins(s.schedule.from); if (from === null) from = 0;
    var to = mins(s.schedule.to); if (to === null) to = 24 * 60;
    return from <= to ? c.minutes >= from && c.minutes < to : c.minutes >= from || c.minutes < to;
  }
  function itemOf(id) { if (!id || !data) return null; for (var i = 0; i < data.items.length; i++) if (data.items[i].id === id) return data.items[i]; return null; }
  function slideItems(s, max) {
    if (!data) return [];
    var pick = [];
    if (s.source === 'items') { (s.itemIds || []).forEach(function (id) { var it = itemOf(id); if (it) pick.push(it); }); }
    else pick = data.items.filter(function (i) { return i.categoryId === s.categoryId; });
    return pick.filter(function (i) { return !(s.hideSoldOut && i.soldOut); }).slice(0, max);
  }
  function fit(t) { var n = (t || '').length; return n > 34 ? ' fit3' : n > 22 ? ' fit2' : n > 14 ? ' fit1' : ''; }

  // ---------- addresses of pictures (the key goes in the address: an <img> can't send headers) ----------
  function tq() { return PREVIEW ? 'co=' + encodeURIComponent((data && data.companyId) || '') : 't=' + encodeURIComponent(token); }
  function mediaUrl(id) { return BASE + '/api/public/signage/media/' + id + '?' + tq(); }
  function isVideo(id) { return !!(data && data.videos && data.videos.indexOf(id) >= 0); }
  function itemUrl(i) {
    if (!i || !i.imageAt) return null;
    return PREVIEW ? BASE + '/api/menu/images/' + data.companyId + '/' + i.id + '?v=' + encodeURIComponent(i.imageAt)
      : BASE + '/api/public/signage/items/' + i.id + '?' + tq() + '&v=' + encodeURIComponent(i.imageAt);
  }
  function logoUrl() { return data && data.logoAt ? BASE + '/api/public/signage/logo/' + data.branchId + '?' + tq() + '&v=' + encodeURIComponent(data.logoAt) : null; }

        o.background = o.background || { kind: 'theme' };

      '@keyframes wob{0%{transform:rotate(0)}80%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}100%{transform:rotate(0)}}' +

  // The picture takes what the headings and items leave (at least 28% of the column); text that still doesn't fit is made smaller.
  function fitBoard(slot) {
    var cols = slot.querySelectorAll('.bd-col');
    for (var i = 0; i < cols.length; i++) {
      var col = cols[i], body = col.querySelector('.bd-body'), inner = body.firstChild, pic = col.querySelector('.bd-pic');
      var H = col.offsetHeight, need = inner.offsetHeight, ph = 0;
      if (pic) {
        ph = Math.max(Math.round(H * 0.28), H - need);
        pic.style.height = ph + 'px';
        if (col.getAttribute('data-pic') === 'top') { pic.style.top = '0'; body.style.top = ph + 'px'; } else { pic.style.top = (H - ph) + 'px'; }
      }
      var avail = H - ph, k = need > avail ? avail / need : 1;
      body.style.height = avail + 'px';
      if (k < 1) { var t = 'scale(' + k.toFixed(3) + ')'; inner.style.webkitTransform = t; inner.style.transform = t; }
    }
  }

  // After a slide is drawn: counters that count up, story cards in turn, the grid spotlight, the menu board's fit.
  function runSlide(s, slot) {
    if (s.layout === 'board') fitBoard(slot);
    var cts = slot.querySelectorAll('.t5-ct');
    if (cts.length) {
      var t = 0, counter = setInterval(function () {
        t++;
        for (var i = 0; i < cts.length; i++) { var to = +cts[i].getAttribute('data-to'); cts[i].innerHTML = Math.min(to, Math.round(to * t / 30)); }
        if (t >= 30) clearInterval(counter);
      }, 50);
      runTimers.push(counter);
    }
    if (s.layout === 'story') {
      var cards = slot.querySelectorAll('.sy-c'), bars = slot.querySelectorAll('.sy-bars i'), n = cards.length;
      var each = Math.max(2, Math.max(3, s.seconds || 10) / Math.max(1, n));
      var showCard = function (k) {
        for (var i = 0; i < n; i++) {
          cards[i].style.opacity = i === k ? '1' : '0';
          var b = bars[i];
          if (i < k) { b.style.webkitAnimation = 'none'; b.style.animation = 'none'; b.style.width = '100%'; }
          if (i === k) { var v = 'growx ' + each + 's linear both'; b.style.width = '100%'; b.style.webkitAnimation = v; b.style.animation = v; }
        }
        var v2 = 'pop .5s ease-out both'; cards[k].style.webkitAnimation = v2; cards[k].style.animation = v2;
      };
      if (n) { showCard(0); for (var k = 1; k < n; k++) (function (k) { runTimers.push(setTimeout(function () { showCard(k); }, k * each * 1000)); })(k); }
    }
    if (s.layout === 'grid' && s.spotlight) {
      var cards2 = slot.querySelectorAll('.card'), j = -1;
      if (cards2.length > 1) runTimers.push(setInterval(function () {
        if (j >= 0) cards2[j].className = cards2[j].className.replace(' lit', '');
        j = (j + 1) % cards2.length; cards2[j].className += ' lit';
      }, 1800));
    }
  }

  // Pictures placed on the slide: x and y (their centre) and width are % of the screen.
  function stickers(s) {
    var list = s.stickers || [];
    if (!list.length) return '';
    var h = '<div class="stk">';
    list.forEach(function (k, i) {
      if (!k.mediaId) return;
      var w = Math.max(2, Math.min(100, k.w || 20)), rot = k.rotate || 0, anim = k.anim || 'none';
      var tr = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
      h += '<div style="left:' + (k.x == null ? 50 : k.x) + '%;top:' + (k.y == null ? 50 : k.y) + '%;width:' + w + '%;-webkit-transform:' + tr + ';transform:' + tr + '">' +
        '<div class="nb" style="' + an(k.enter === 'none' ? 'fade' : 'pop', .7, .5 + i * .15) + '"><div class="' + (anim !== 'none' ? 'st-' + esc(anim) : '') + '">' +
        (isVideo(k.mediaId) ? '<video src="' + esc(mediaUrl(k.mediaId)) + '" autoplay muted loop playsinline style="width:100%;display:block"></video>' : '<img src="' + esc(mediaUrl(k.mediaId)) + '" alt="">') +
        '</div></div></div>';
    });
    return h + '</div>';
  }

  function slideHtml(s) {
    var sp = SPEED[s.speed] || 0.85, bg = s.background || {}, h = '';
    if (bg.kind === 'color' && bg.color) h += '<div class="bgfill" style="background:' + esc(bg.color) + '"></div>';
    if (bg.kind === 'media' && bg.mediaId) h += mediaFill(bg.mediaId) + '<div class="bgfill" style="background:rgba(0,0,0,' + ((bg.dim == null ? 40 : bg.dim) / 100) + ')"></div>';
    var L = s.layout;
    h += L === 'hero' ? hero(s, sp) : L === 'offer' ? offer(s, sp) : L === 'grid' ? grid(s, sp) : L === 'list' ? list(s, sp) : L === 'fresh' ? fresh(s, sp)
      : L === 'zoom' ? zoom(s) : L === 'kinetic' ? kinetic(s) : L === 'flash' ? flash(s) : L === 'top5' ? top5(s) : L === 'combo' ? combo(s)
      : L === 'neon' ? neon(s) : L === 'polaroid' ? polaroid(s) : L === 'versus' ? versus(s) : L === 'story' ? story(s) : L === 'board' ? board(s) : mediaSlide(s, sp);
    return h;
  }

  // ---------- the screen: ambient, slide, bottom bar ----------
  function barHtml() {
    var th = theme;
    if (!(th.ticker.on || th.showClock || th.showLogo)) return '';
    var h = '<div class="bar">', logo = logoUrl();
    if (th.showLogo) h += '<div class="brand">' + (logo ? '<img src="' + esc(logo) + '" alt="">' : '') + esc((data && data.branch) || '') + '</div>';
    h += '<div class="ticker">';
    var ms = (th.ticker.messages || []).filter(Boolean);
    if (th.ticker.on && ms.length) {
      var one = ms.map(function (m) { return '<span>' + esc(m) + '<i>&#9679;</i></span>'; }).join(''), d = Math.max(10, th.ticker.seconds) + 's';
      h += '<div class="track" style="-webkit-animation-duration:' + d + ';animation-duration:' + d + '">' + one + one + '</div>';
    }
    h += '</div>';
    if (th.showClock) h += '<div class="clock" id="clk"></div>';
    return h + '</div>';
  }
  function tickClock() {
    var el = document.getElementById('clk');
    if (el) { var c = clock(), hh = c.h % 12 || 12; el.innerHTML = hh + ':' + two(c.m) + ' ' + (c.h < 12 ? 'AM' : 'PM'); }
    var cd = stage.querySelector('.cd');
    if (cd) { var left = secondsLeft(cd.getAttribute('data-ends'), clock()); if (left !== null && left > 0) cd.innerHTML = countdown(left); }
    var fc = stage.querySelector('.fl-cd');
    if (fc) { var l2 = secondsLeft(fc.getAttribute('data-ends'), clock()); if (l2 !== null && l2 > 0) fc.innerHTML = flashCd(l2); }
  }

  // ---------- a new One POS version: load the page again at a quiet moment ----------
  function videosOn() { var sl = document.getElementById('slot'); return sl ? sl.getElementsByTagName('video') : []; }
  function reloadNow() {   // only once the server answers, so the TV never lands on an error page
    if (reloading) return;
    reloading = true;
    var x = new XMLHttpRequest();
    x.open('GET', BASE + '/tv.html?_=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) location.reload(); else { reloading = false; setTimeout(reloadNow, 30000); }
    };
    x.send(null);
  }
  function reloadSoon() {   // between slides; on a video, when it reaches its end (at most 10 minutes later)
    if (reloadDue || PREVIEW) return;
    reloadDue = true;
    var v = videosOn();
    if (!v.length || !current) { reloadNow(); return; }
    for (var i = 0; i < v.length; i++) v[i].loop = false;   // its "ended" then reloads instead of looping
    setTimeout(reloadNow, 10 * 60 * 1000);
  }

  function build() {   // the design changed: draw the frame again and start the loop
    applyCss(theme);
    stage.innerHTML = (theme.ambient === 'none' ? '' : '<div class="amb"></div>') + '<div id="slot"></div><div id="fx"></div>' + barHtml();
    idx = -1;
    next();
  }
  function stopRun() { for (var i = 0; i < runTimers.length; i++) { clearTimeout(runTimers[i]); clearInterval(runTimers[i]); } runTimers = []; }
  function next() {
    clearTimeout(slideTimer);
    var c = clock(), list = lockId ? slides.filter(function (s) { return s.id === lockId; }) : slides.filter(function (s) { return playsNow(s, c); });
    var slot = document.getElementById('slot'), fx = document.getElementById('fx');
    if (!slot) return;
    if (reloadDue && (list.length !== 1 || !videosOn().length)) { reloadNow(); return; }   // between slides (one video alone: at its end)
    // Only one slide to show and it is already on screen: leave it alone, so a video keeps looping instead of starting over.
    if (!lockId && list.length === 1 && current && current.id === list[0].id && slot.firstChild) { slideTimer = setTimeout(next, 30000); return; }
    stopRun();
    if (!list.length) {
      var logo = logoUrl();
      slot.innerHTML = '<div class="idle">' + (logo ? '<img src="' + esc(logo) + '" alt="">' : '<div>' + esc((data && data.branch) || '') + '</div>') + '</div>';
      fx.innerHTML = ''; current = null; stage.className = '';
      slideTimer = setTimeout(next, 30000);
      return;
    }
    idx = (idx + 1) % list.length; round++;
    var s = list[idx], secs = Math.max(3, s.seconds || 10);
    current = s;
    var tr = lockId ? '' : theme.transition !== 'flash' && theme.transition !== 'none' ? ' t-' + esc(theme.transition) : '';
    stage.className = s.layout === 'media' && s.mediaId ? 'slim' : '';
    slot.innerHTML = '<div class="slide a-' + esc(s.animation) + tr + '">' + slideHtml(s) + '</div>' + stickers(s);
    fx.innerHTML = lockId ? '' : (theme.transition === 'flash' ? '<div class="flash"></div>' : '') + (list.length < 2 ? '' :
      '<div class="prog" style="-webkit-animation-duration:' + secs + 's;animation-duration:' + secs + 's"></div>');
    var vids = slot.getElementsByTagName('video');   // older TV browsers may ignore "loop": start it again when it ends
    for (var v = 0; v < vids.length; v++) vids[v].addEventListener('ended', function () { if (reloadDue) { reloadNow(); return; } try { this.currentTime = 0; this.play(); } catch (e) {} });
    runSlide(s, slot);
    if (!lockId) slideTimer = setTimeout(next, list.length < 2 ? 30000 : secs * 1000);
  }
  function blank() { clearTimeout(slideTimer); stopRun(); stage.innerHTML = ''; stage.className = ''; current = null; }

  // ---------- scale the 1920 x 1080 picture to the screen ----------
  function scale() {
    var W = window.innerWidth || document.documentElement.clientWidth, H = window.innerHeight || document.documentElement.clientHeight;
    var k = Math.min(W / 1920, H / 1080), l = Math.round((W - 1920 * k) / 2), t = Math.round((H - 1080 * k) / 2);
    var tr = 'translate(' + l + 'px,' + t + 'px) scale(' + k + ')';
    stage.style.webkitTransform = tr; stage.style.transform = tr;
  }

  // ---------- link and play ----------
  function show(html) { msg.innerHTML = html; msg.style.display = html ? 'block' : 'none'; }
  function system() {
    var ua = navigator.userAgent || '';
    return /VIDAA|Hisense|HiBrowser/i.test(ua) ? 'Hisense VIDAA' : /Tizen/i.test(ua) ? 'Samsung Tizen' : /Web0S|webOS/i.test(ua) ? 'LG webOS'
      : /Viera|Panasonic/i.test(ua) ? 'Panasonic / VIDAA' : /Android/i.test(ua) ? 'Android TV' : /Windows/i.test(ua) ? 'Windows PC' : 'TV browser';
  }
  function size() { var r = window.devicePixelRatio || 1; return { w: Math.round(screen.width * r), h: Math.round(screen.height * r) }; }
  function showCode(code) {
    blank();
    show('<div class="t">One POS &middot; TV screens</div><div class="h">Link this TV</div><div class="code">' + esc(code.substr(0, 3)) + '&nbsp;' + esc(code.substr(3)) +
      '</div><div class="s">In One POS open <b>TV screens</b>, type this code under <b>TVs</b> and press <b>Add TV</b>.<br>The menu shows here by itself a few seconds later.</div>');
  }
  function pair() {
    var sz = size();
    token = null;
    req('POST', '/api/public/signage/pair', { detected: system(), width: sz.w, height: sz.h }, function (status, j) {
      if (status === 200 && j && j.token) { token = j.token; store(KEY, token); showCode(j.code); }
      else show('<div class="err">Can\'t reach One POS (' + status + '). Trying again&hellip;</div>');
    });
  }
  function poll() {
    if (!token) { pair(); return; }
    var sz = size();
    req('GET', '/api/public/signage/play?w=' + sz.w + '&h=' + sz.h + '&_=' + new Date().getTime(), null, function (status, j) {
      if (status === 401) { store(KEY, null); play = null; designKey = null; pair(); return; }
      if (status !== 200 || !j) { if (!play) show('<div class="err">Can\'t reach One POS (' + status + '). Trying again&hellip;</div>'); return; }
      if (j.version) { if (!version) version = j.version; else if (j.version !== version && !newSeen) { newSeen = true; setTimeout(reloadSoon, 60000); } }   // a minute: the update finishes first
      if (!j.linked) { play = null; designKey = null; showCode(j.code); return; }
      show('');
      play = j; data = j.data;
      var on = j.screen && j.screen.isOn && j.design;
      if (!on) { designKey = null; blank(); return; }
      var key = j.design.id + '|' + j.design.updatedAt + '|' + (data.logoAt || '') + '|' + data.branch;
      if (key !== designKey) {
        designKey = key;
        var d = normalize(j.design.content);
        theme = d.theme; slides = d.slides;
        build();
      }
      // New prices, photos and sold-out items show from the next slide on, so the current one doesn't jump.
    });
  }

  // ---------- full screen, start ----------
  function full() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) return;
    try {
      var f = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (f) { var p = f.call(el); if (p && p['catch']) p['catch'](function () {}); }
    } catch (e) {}
  }
  window.addEventListener('resize', scale);
  scale();
  show('');
  setInterval(tickClock, 1000);
  if (PREVIEW) {
    // The designer sends the design, the branch's menu and the slide to show (none: play the loop); same page, same session.
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return;
      var m = e.data;
      if (!m || m.type !== 'onepos-tv') return;
      data = m.data || { items: [], categories: [], videos: [], currency: 'AED', branch: '' };
      var d = normalize(m.content);
      theme = d.theme; slides = d.slides; lockId = m.lock || null;
      build();
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'onepos-tv-ready' }, location.origin);
    return;
  }
  document.addEventListener('keydown', full);
  document.addEventListener('click', full);
  full();
  token = load(KEY);
  poll();
  pollTimer = setInterval(poll, 10000);
  setTimeout(reloadSoon, 6 * 60 * 60 * 1000);   // a fresh page now and then, also at a quiet moment
})();
</script>
