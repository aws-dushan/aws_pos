# /onepos and /onepos-test — One POS (live and test), installed by `onepos route` (deploy/bin/onepos).
#
# The prefix is KEPT: each web image is built with basePath /onepos or /onepos-test (deploy/release.sh), so Next writes it into every asset
# URL and link. Stripping it here would deliver the HTML and 404 every script. The two must agree.
#
# Longest prefix wins, so /onepos-test/... never reaches live.
# Upgrade/Connection: the live hub (/onepos/hubs/live, SignalR websockets) — order changes, kitchen, day close countdown on the tills.
# Because a proxy_set_header in a location replaces every inherited one, the others from nginx.conf are repeated here.
#
# This file is not in the SFA platform's route manifest (.routes-owned), so sync-infra.sh leaves it alone.

location /onepos-test {
	set $upstream_onepos_test "onepos-test-web:3000";
	proxy_pass http://$upstream_onepos_test;

	proxy_set_header Host              $http_host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $http_host;
	proxy_set_header X-Forwarded-Port  $server_port;
	proxy_set_header Upgrade           $http_upgrade;
	proxy_set_header Connection        $connection_upgrade;

	# Item pictures, logos, feedback screenshots; Device Service installers are downloaded, not uploaded here.
	client_max_body_size 30m;
	# The live hub keeps its connection open; a year's report can take a few seconds.
	proxy_read_timeout 3600s;
	proxy_buffering off;
}

location /onepos {
	set $upstream_onepos_live "onepos-live-web:3000";
	proxy_pass http://$upstream_onepos_live;

	proxy_set_header Host              $http_host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $http_host;
	proxy_set_header X-Forwarded-Port  $server_port;
	proxy_set_header Upgrade           $http_upgrade;
	proxy_set_header Connection        $connection_upgrade;

	client_max_body_size 30m;
	proxy_read_timeout 3600s;
	proxy_buffering off;
}
