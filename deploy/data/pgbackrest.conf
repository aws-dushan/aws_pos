# pgBackRest for one One POS database (inside its container). The repository is DATA_DIR/pgbackrest on the data server.
# Keeps 2 full backups (weekly) with their differentials (nightly) and every WAL segment between them: restore to any moment of the
# last ~2 weeks (bin/restore-pitr.sh on the data server).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
compress-type=zst
start-fast=y
process-max=2
log-path=/var/lib/pgbackrest/log
log-level-console=info
log-level-file=info

[onepos]
pg1-path=/var/lib/postgresql/data
pg1-user=onepos_owner
pg1-database=onepos
